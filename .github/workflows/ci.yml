name: Healthcare CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npx --yes --package typescript tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --lib es2022,webworker workers/src/services/legacy_health_daily_service.ts
